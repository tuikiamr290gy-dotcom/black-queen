name: Create Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate keystore
        run: |
          mkdir -p keys
          keytool -genkeypair -v -keystore keys/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore keys/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      - name: Commit keystore
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add keys/debug.keystore
          git commit -m "Add debug keystore"
          git push
